name: README contributions

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/scripts/readme_contributions.py"
      - ".github/scripts/readme_contributions.json"
      - ".github/scripts/test_readme_contributions.py"
      - ".github/workflows/readme-contributions.yml"
  push:
    branches: [main]
    paths:
      - ".github/scripts/readme_contributions.py"
      - ".github/scripts/readme_contributions.json"
      - ".github/scripts/test_readme_contributions.py"
      - ".github/workflows/readme-contributions.yml"

permissions:
  contents: read

concurrency:
  group: readme-contributions-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m unittest discover -s .github/scripts -p test_readme_contributions.py
  refresh:
    if: github.event_name != 'pull_request'
    needs: test
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Generate contribution feed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/readme_contributions.py
      - name: Publish generated assets only
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp assets/readme/contributions.svg assets/readme/contributions.md "$tmp/"
          rm assets/readme/contributions.svg assets/readme/contributions.md
          git fetch origin readme-contributions
          git switch --detach FETCH_HEAD
          mkdir -p assets/readme
          cp "$tmp/contributions.svg" "$tmp/contributions.md" assets/readme/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/readme/contributions.svg assets/readme/contributions.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: refresh upstream contribution feed"
          git push origin HEAD:refs/heads/readme-contributions
