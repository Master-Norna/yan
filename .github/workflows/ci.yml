# 推到 main 与每个 PR 都跑一遍。言以 Windows 为准：check 一项挡合并；端到端与 macOS 先试跑，失败都不挡
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: 单测 · 类型 · 格式
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run unit
      - run: npm run check
      - run: npx --yes prettier@3.3.3 --check .

  e2e:
    name: 端到端（试跑）
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node test/run.mjs

  macos:
    name: macOS 测试（不挡合并）
    runs-on: macos-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run check
      - run: npm run unit
      - run: node test/run.mjs
        env:
          # runner 上 Edge 和 Chrome 都有，不指定时 run.mjs 会先选 Edge。这里固定用 Chrome，是因为 macOS 上的验证（包括看台连跑）都是在 Chrome 上做的，也免得镜像变动时悄悄换了浏览器；macOS 上的 Edge 还没验证过
          YAN_TEST_BROWSER: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: yan-test-diagnostics-macos
          path: test/.tmp/*.png
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
