# 推到 main 与每个 PR 都跑一遍。言以 Windows 为准：Windows 的 check 与端到端两项挡合并（分支保护里登记的必过项按名字认，改 name 要一起改）；macOS 失败不挡
# Node 版本：Windows 用户多跑便携包里带的那份，两项 Windows 与 pack/pack.mjs 的 NODE 同一大版本，换版本两处一起改；macOS 用系统自装的 Node，留 22，守住 package.json engines 的下限
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: 单测 · 类型 · 格式
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm run unit
      - run: npm run check
      - run: npx --yes prettier@3.3.3 --check .

  # 最低版本另在 Windows 上跑一遍：engines 写的是 >=22，macOS 那份跑的也是 22，但 macOS 走不到沙箱、任务栏、
  # .cmd 启动器这些只有 Windows 才有的路。只跑单测，不重跑端到端；名字不进分支保护，先作参考。
  check-node22:
    name: 单测 · Node 22（不挡合并）
    runs-on: windows-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run unit

  e2e:
    name: 端到端
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node test/run.mjs
      # 失败时留下的截图就在 test/.tmp 下（lib.mjs 的 shot）；Windows 是必过项，没有附件维护者只能本地复现才看得到画面
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: yan-test-diagnostics-windows
          path: test/.tmp/*.png
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  macos:
    name: macOS 测试（不挡合并）
    runs-on: macos-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run check
      - run: npm run unit
      - run: node test/run.mjs
        env:
          # runner 上 Edge 和 Chrome 都有，不指定时 run.mjs 会先选 Edge。这里固定用 Chrome，是因为 macOS 上的验证（包括看台连跑）都是在 Chrome 上做的，也免得镜像变动时悄悄换了浏览器；macOS 上的 Edge 还没验证过
          YAN_TEST_BROWSER: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: yan-test-diagnostics-macos
          path: test/.tmp/*.png
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
