# 推到 main、PR 或手动触发。Windows 的「单测 · 类型 · 格式」与「端到端」挡合并（分支保护按作业名认，改 name 要一起改）；Windows Node 22 与 macOS 作参考。
# 两项 Windows 必过作业用便携包里 Node 的同一大版本（pack/pack.mjs 的 NODE）；macOS 和 Windows 补测用 22，守住 package.json engines 的下限。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: 单测 · 类型 · 格式
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm run unit
      - run: npm run check
      # 临时诊断：输出 Prettier 精确差异；取得差异后恢复本工作流，再提交格式修复。
      - run: |
          npx --yes prettier@3.3.3 --write src/17-settings/50-mcp.js
          git diff -- src/17-settings/50-mcp.js
      - run: npx --yes prettier@3.3.3 --check .

  # 最低版本另在 Windows 上跑一遍：engines 写的是 >=22，macOS 那份跑的也是 22，但 macOS 走不到沙箱、任务栏、
  # .cmd 启动器这些只有 Windows 才有的路。只跑单测，不重跑端到端；名字不进分支保护，先作参考。
  check-node22:
    name: 单测 · Node 22（不挡合并）
    runs-on: windows-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run unit

  e2e:
    name: 端到端
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node test/run.mjs
      # 失败时留下的截图就在 test/.tmp 下（lib.mjs 的 shot）；Windows 是必过项，没有附件维护者只能本地复现才看得到画面
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: yan-test-diagnostics-windows
          path: test/.tmp/*.png
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  macos:
    name: macOS 测试（不挡合并）
    runs-on: macos-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run check
      - run: npm run unit
      - run: node test/run.mjs
        env:
          # run.mjs 默认优先找 Edge；Apple 芯片 Mac 上按端到端的无头参数实测 Edge 不产渲染帧、同环境 Chrome 能跑。
          # 这里只固定测试浏览器（含游目用例的第二个实例），不代表普通窗口或产品的无头浏览器有同样问题。
          YAN_TEST_BROWSER: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: yan-test-diagnostics-macos
          path: test/.tmp/*.png
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
