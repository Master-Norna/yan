<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>言</title>
  <script src="./theme-boot.js"></script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23fbfaf6'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='20' font-family='serif' fill='%239b5540'%3E言%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./vendor/katex/katex.min.css">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar"><div class="sidebar-inner">
      <div class="brand-row"><div class="brand-mark wide">言</div><button id="collapseSidebar" class="icon-btn collapse-btn" title="收起侧栏">‹</button></div>
      <div id="modeSeal" class="mode-seal" data-mode="chat" role="status" aria-label="当前为言 · 对谈"><span class="rail-icon">言</span><span class="wide">对谈</span></div>
      <button id="newChat" class="rail-btn new-chat" title="另起一段对话"><span class="rail-icon">＋</span><span class="wide">翻页</span></button>
      <button id="openLibrary" class="rail-btn library-open" title="卷宗"><span class="rail-icon"><span class="archive-seal" aria-hidden="true">卷</span></span><span class="wide">卷宗</span><span id="libraryCount" class="wide count"></span></button>
      <div class="history-head wide"><span>对话历史</span><span class="history-head-line"></span><button id="historySearchToggle" class="icon-btn" title="查找对话" aria-label="查找对话"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="7" cy="7" r="4.3"/><path d="M10.3 10.3 13.5 13.5"/></svg></button></div>
      <div id="historySearchWrap" class="history-search-wrap wide hidden"><input id="historySearch" class="history-search" placeholder="按标题或正文查找" aria-label="查找对话"><button id="historySearchClose" class="icon-btn" title="关闭查找">×</button></div>
      <div id="history" class="history wide"></div>
      <div class="sidebar-footer"><button id="openSettings" class="settings-open" title="设置"><span class="rail-icon"><span id="avatar" class="avatar">客</span></span><span id="displayNameSidebar" class="wide name">访客</span><span class="wide gear">⚙</span></button></div>
    </div></aside>
    <div id="sidebarScrim" class="sidebar-scrim hidden" aria-hidden="true"></div>
    <main class="main">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:6px"><button id="mobileMenu" class="icon-btn mobile-menu hidden" title="打开侧栏">☰</button><div id="modelMenu" class="model-menu hidden" role="dialog" aria-label="选择模型与思考深度"></div></div>
        <div class="top-actions"><div id="connection" class="connection" data-state="idle"><span class="status-dot" aria-hidden="true"></span><span id="connectionText">就绪</span></div><span class="top-sep" aria-hidden="true"></span><button id="themeToggle" class="theme-toggle" type="button" title="落墨 · 暗色" aria-label="切换明暗" data-theme="light"><svg viewBox="0 0 20 20" aria-hidden="true"><circle class="yan-rim" cx="10" cy="10" r="7.4"/><circle class="yan-pool" cx="10" cy="10" r="7.4"/><circle class="yan-drop" cx="12.4" cy="7.4" r="2.1"/></svg></button><span class="top-sep" aria-hidden="true"></span><button id="quotaStatus" class="quota" title="余墨" aria-label="模型余墨量"><span class="quota-label">余墨</span><span class="ink-gauge" aria-hidden="true"><svg viewBox="0 0 68 12"><defs><clipPath id="inkClip"><path d="M1.4 6.4C8 4.2 18 3.9 30 4.4c12 .5 22 1.3 34.4.2.9-.1 1.5.9 1 1.6-3.8 2.8-11.6 3-21 2.6C33 8.4 22 7.6 11 8.5c-3.4.3-6.8.5-9.2-.5-.9-.4-1-1.3-.4-1.6z"/></clipPath><linearGradient id="inkGrad"><stop class="ink-grad-a" offset="0"/><stop class="ink-grad-b" offset=".82"/><stop class="ink-grad-c" offset="1"/></linearGradient></defs><path class="ink-ghost" d="M1.4 6.4C8 4.2 18 3.9 30 4.4c12 .5 22 1.3 34.4.2.9-.1 1.5.9 1 1.6-3.8 2.8-11.6 3-21 2.6C33 8.4 22 7.6 11 8.5c-3.4.3-6.8.5-9.2-.5-.9-.4-1-1.3-.4-1.6z"/><g clip-path="url(#inkClip)"><rect id="quotaFill" class="ink-fill" x="0" y="0" width="68" height="12"/><path class="ink-streak" d="M4 5.2C20 4 36 6.4 62 4.6M6 8.4c18 .6 32-1.8 56-.2"/></g></svg></span><span id="quotaText" class="quota-text">未设</span></button></div>
      </header>
      <section id="welcome" class="welcome"><div class="welcome-inner"><div class="eyebrow"><span class="seal">言</span><span id="welcomeMode">对谈</span></div><h1 id="greeting">落笔，便有回声</h1><p id="welcomeSub">长问慢答，尽付纸墨</p><div id="welcomeChips" class="welcome-chips"><button id="workdirChip" class="chip hidden" type="button"><span class="chip-glyph">目录</span><span class="chip-text"></span><span class="chip-caret">▾</span></button><button id="approveChip" class="chip hidden" type="button"><span class="chip-text"></span></button></div><div class="composer"><div id="welcomeAttachments" class="attachment-list hidden"></div><textarea id="welcomeInput" rows="1" placeholder="落墨于此"></textarea><div class="composer-row"><div class="composer-left"><button class="text-btn attach-trigger" type="button" title="附件" aria-label="附件" aria-haspopup="menu"><span>＋</span></button></div><div class="composer-right"><div class="model-wrap"><button class="model-trigger" type="button" title="选择模型与思考深度"><span class="model-dot"></span><span class="model-name">尚未接入模型</span><span class="model-extra"></span><span class="model-caret">▾</span></button></div><button class="send-btn send-trigger" title="发送"><span class="seal-glyph" aria-hidden="true">寄</span></button></div></div></div><div id="welcomeNotice" class="welcome-notice hidden" role="status"></div><div class="suggestions"><button class="suggestion" data-prompt="请润色下面这段文字：保留原意，让表达更简洁准确，语气克制。只输出改后的文本，末尾用一两句说明主要改动。&#10;&#10;（把文字贴在这里）">润色这段文字</button><button class="suggestion" data-prompt="请解释下面这段代码：先一句话概括它做什么，再逐块说明关键逻辑，最后指出可能的问题与改进点。&#10;&#10;（把代码贴在这里）">解释一段代码</button><button class="suggestion" data-prompt="请总结我附上的文档：先用三句话概括主旨，再分点列出要点与结论，最后标出需要我特别留意的地方。">总结这份文档</button><button class="suggestion" data-prompt="请把下面的中文译成自然、地道的英文，保持原有的语气与语域。若有多种译法，给出最合适的一种并简要说明取舍。&#10;&#10;（把文字贴在这里）">译成地道英文</button></div></div></section>
      <section id="chat" class="chat hidden"><div id="chatScroll" class="chat-scroll"><div class="chat-inner"><div class="chat-title"><h1 id="chatTitle" contenteditable="true" spellcheck="false" title="修改标题"></h1><div id="chatMeta"></div></div><div id="messages"></div></div></div></section>
      <section id="library" class="library-page hidden"><div class="library-inner"><div class="eyebrow"><span class="seal">卷</span><span>ARCHIVE</span></div><h1>卷宗</h1><p class="library-lead"><span id="libraryLead">常用的文件收于此处；置于案上，便随下一问送出。</span><span id="libraryCountText" class="library-count"></span></p><div class="library-tools"><input id="librarySearch" class="field" placeholder="按文件名查找" aria-label="查找卷宗"><div class="segmented"><button data-library-kind="all" class="active">全部</button><button data-library-kind="image">画</button><button data-library-kind="text">文</button><button data-library-kind="file">卷</button></div><button id="libraryAdd" class="outline-btn">＋ 收入文件</button></div><div id="libraryGrid" class="library-grid"></div></div></section>
      <nav id="outline" class="outline hidden" aria-label="按问题跳转"></nav>
      <button id="jumpBottom" class="jump-bottom hidden" type="button">↓ 回到最新</button>
      <div id="quoteTip" class="quote-tip hidden" role="toolbar" aria-label="对所选文字"><button type="button" data-tip="quote" title="引为下一问的引文">引用</button><span class="quote-tip-sep" aria-hidden="true"></span><button type="button" data-tip="note" title="就此处另开旁注，不入正文">旁注</button></div><div id="composerArea" class="composer-area hidden"><div id="approvalBar" class="approval-bar hidden" data-step-id="" role="status" aria-live="polite"></div><button id="helperBar" class="helper-bar hidden" type="button" data-step-id="" title="前往差遣卡片"></button><div class="composer"><div id="composerQuote" class="composer-quote hidden"><span class="composer-quote-text"></span><button id="composerQuoteClose" class="composer-quote-close" type="button" title="移除引文" aria-label="移除引文">✕</button></div><div id="attachments" class="attachment-list hidden"></div><textarea id="chatInput" rows="1" placeholder="续言于此"></textarea><div class="composer-row"><div class="composer-left"><button class="text-btn attach-trigger" type="button" title="附件" aria-label="附件" aria-haspopup="menu"><span>＋</span></button><button id="workAuto" class="text-btn hidden" type="button"></button></div><div class="composer-right"><div class="model-wrap"><button class="model-trigger" type="button" title="选择模型与思考深度"><span class="model-dot"></span><span class="model-name">尚未接入模型</span><span class="model-extra"></span><span class="model-caret">▾</span></button></div><button id="chatSend" class="send-btn send-trigger" title="发送"><span class="seal-glyph" aria-hidden="true">寄</span></button></div></div></div><div class="composer-foot"><div class="hint">Enter 发送 · Shift + Enter 换行 · 粘贴即附图</div><button id="contextGauge" class="context-gauge hidden" type="button" aria-label="当前上下文大小"><span class="context-gauge-label">上下文</span><span class="context-gauge-tilde">≈</span><span class="context-gauge-value"></span><span class="context-gauge-window"></span></button></div></div>
      <input id="fileInput" type="file" multiple class="hidden">
      <input id="libraryFileInput" type="file" multiple class="hidden">
      <input id="importInput" type="file" accept="application/json,.json" class="hidden">
    </main>
    <aside id="sidePanel" class="side-panel hidden" aria-label="旁注">
      <div class="side-head"><span class="seal side-seal" aria-hidden="true">注</span><div class="side-title"><strong>旁注</strong><small>不入正文</small></div><span id="sideNav" class="branch-nav side-nav"></span><span class="side-tools"><button id="sideExpand" class="icon-btn" type="button" title="铺满整页" aria-pressed="false">阔</button><button id="sideRemove" class="icon-btn" type="button" title="移除这条旁注">删</button><button id="sideClose" class="icon-btn" type="button" title="收起">×</button></span></div>
      <button id="sideAnchor" class="side-anchor" type="button" title="回到出处"></button>
      <div id="sideScroll" class="side-scroll"><div id="sideMessages" class="side-messages"></div></div>
      <div class="side-composer"><div class="side-composer-row"><textarea id="sideInput" rows="1" placeholder="就此处追问"></textarea><button id="sideSend" class="send-btn" type="button" title="发送"><span class="seal-glyph" aria-hidden="true">寄</span></button></div><div class="side-foot"><button id="sideBack" class="side-back" type="button" title="回到旁注目录"><span aria-hidden="true">‹</span>目录</button><div class="model-wrap"><button class="model-trigger" type="button" title="选择模型与思考深度"><span class="model-dot"></span><span class="model-name">尚未接入模型</span><span class="model-extra"></span><span class="model-caret">▾</span></button></div></div></div>
    </aside>
    <aside id="helperPanel" class="side-panel helper-panel hidden" aria-label="差遣">
      <div class="side-head"><span class="seal side-seal" aria-hidden="true">遣</span><div class="side-title"><strong>差遣</strong><small id="helperPanelSub">帮手另起一段，回报入正文</small></div><span id="helperPanelNav" class="helper-panel-nav"></span><span class="side-tools"><button id="helperExpand" class="icon-btn" type="button" title="铺作整页" aria-pressed="false">阔</button><button id="helperClose" class="icon-btn" type="button" title="合起">合</button></span></div>
      <button id="helperAnchor" class="side-anchor" type="button" title="回到行迹里这一步"></button>
      <div id="helperScroll" class="side-scroll"><div id="helperPanelBody" class="helper-panel-body"></div></div>
    </aside>
  </div>
  <div id="settingsModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="设置"><div class="modal-panel"><button id="closeSettings" class="icon-btn close-modal" title="关闭">×</button><nav class="settings-nav"><div class="settings-nav-title">设置</div><button class="tab-btn active" data-tab="general">通用</button><button class="tab-btn" data-tab="appearance">个性化</button><button class="tab-btn" data-tab="models">模型</button><button class="tab-btn" data-tab="tools">工具</button><button class="tab-btn" data-tab="memory">记忆</button><button class="tab-btn" data-tab="about">关于</button><div class="settings-nav-spacer"></div><div class="settings-nav-foot">言之有物<br>字字留痕</div></nav><div id="settingsContent" class="settings-content"></div></div></div>
  <div id="dropVeil" class="drop-veil hidden"><div class="drop-sheet"><span class="drop-seal">添</span><span class="drop-copy"><strong id="dropTitle">松手，置于案上</strong><small id="dropHint">图片、文档与代码文件 · 单次共 64 MB</small></span></div></div>
  <div id="confirmModal" class="modal hidden" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle"><div class="confirm-panel"><span class="seal">问</span><h3 id="confirmTitle"></h3><p id="confirmBody"></p><div class="confirm-actions"><button id="confirmCancel" class="outline-btn">取消</button><button id="confirmOk" class="danger-btn solid">确定</button></div></div></div>
  <div id="imageViewer" class="image-viewer hidden" role="dialog" aria-modal="true" aria-labelledby="imageViewerName"><div class="image-viewer-head"><span class="seal" aria-hidden="true">画</span><span id="imageViewerName" class="image-viewer-name"></span><div class="image-viewer-actions"><button id="imageViewerZoom" type="button">原图</button><button id="imageViewerDownload" type="button">下载</button><button id="imageViewerClose" class="image-viewer-close" type="button" title="关闭" aria-label="关闭图片">×</button></div></div><div id="imageViewerStage" class="image-viewer-stage"><img id="imageViewerImage" class="image-viewer-image" alt=""></div></div>
  <div id="fileViewer" class="file-viewer hidden" role="dialog" aria-modal="true" aria-labelledby="fileViewerName"><div class="file-viewer-head"><span class="seal" aria-hidden="true">览</span><span id="fileViewerName" class="file-viewer-name"></span><div class="file-viewer-actions"><button id="fileViewerDownload" type="button">下载</button><button id="fileViewerClose" class="file-viewer-close" type="button" title="关闭" aria-label="关闭预览">×</button></div></div><div id="fileViewerStage" class="file-viewer-stage"></div></div>
  <div id="toast" class="toast hidden"></div>
  <script src="./vendor/marked.umd.js"></script>
  <script src="./vendor/purify.min.js"></script>
  <script src="./vendor/highlight.min.js"></script>
  <script src="./prompts/assistant.js"></script>
<script src="./prompts/work.js"></script>
<script src="./prompts/side.js"></script>
<script src="./prompts/memory.js"></script>
<script src="./prompts/delegate.js"></script>
<script src="./prompts/tools.js"></script>
<script src="./support.js"></script>
</body>
</html>
