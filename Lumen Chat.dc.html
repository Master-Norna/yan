      <header class="topbar">
        <div style="display:flex;align-items:center;gap:6px"><button id="mobileMenu" class="icon-btn mobile-menu hidden" title="打开侧栏">☰</button><div class="model-wrap"><button id="modelTrigger" class="model-trigger"><span class="model-dot"></span><span id="activeModelName">尚未配置模型</span><span style="font-size:9px;color:var(--ink-3)">▾</span></button><div id="modelMenu" class="model-menu hidden"></div></div></div>
        <div class="top-actions"><div id="connection" class="connection" data-state="idle"><span class="status-dot"></span><span id="connectionText">就绪</span></div><button id="themeToggle" class="icon-btn" title="切换明暗">☀</button><button id="quotaStatus" class="quota" title="余墨" aria-label="模型余墨量"><span class="quota-label">余墨</span><span class="ink-gauge" aria-hidden="true"><svg viewBox="0 0 68 12"><defs><clipPath id="inkClip"><path d="M2 5.6C7 2.6 15 1.7 25 2.5c9 .7 17 2.3 27 1.6 5-.4 9.5-1.8 13.4-.4.9.4 1.1 1.6.4 2.3-3.6 3.4-10 4.6-18 4.3-9.8-.4-19-2.2-28.5-1.3-5.4.5-10.6 1.9-15.2 1-1.6-.3-2.6-1.7-2.1-3.4z"/></clipPath><linearGradient id="inkGrad"><stop class="ink-grad-a" offset="0"/><stop class="ink-grad-b" offset=".82"/><stop class="ink-grad-c" offset="1"/></linearGradient></defs><path class="ink-ghost" d="M2 5.6C7 2.6 15 1.7 25 2.5c9 .7 17 2.3 27 1.6 5-.4 9.5-1.8 13.4-.4.9.4 1.1 1.6.4 2.3-3.6 3.4-10 4.6-18 4.3-9.8-.4-19-2.2-28.5-1.3-5.4.5-10.6 1.9-15.2 1-1.6-.3-2.6-1.7-2.1-3.4z"/><g clip-path="url(#inkClip)"><rect id="quotaFill" class="ink-fill" x="0" y="0" width="68" height="12"/><path class="ink-streak" d="M4 5.2C20 4 36 6.4 62 4.6M6 8.4c18 .6 32-1.8 56-.2"/></g></svg></span><span id="quotaText" class="quota-text">未设</span></button></div>
      </header>
      <section id="welcome" class="welcome"><div class="welcome-inner"><div class="eyebrow"><span class="seal">言</span><span id="welcomeModel">LOCAL CHAT</span></div><h1 id="greeting">落笔，便有回声</h1><p>一方素纸，容得下长问，也留得住慢答</p><div class="composer"><div id="welcomeAttachments" class="attachment-list hidden"></div><textarea id="welcomeInput" rows="1" placeholder="落墨于此"></textarea><div class="composer-row"><button class="text-btn attach-trigger"><span>＋</span>附件</button><button class="send-btn send-trigger" title="发送">↑</button></div></div><div class="suggestions"><button class="suggestion" data-prompt="请润色下面这段文字：保留原意，让表达更简洁准确，语气克制。只输出改后的文本，末尾用一两句说明主要改动。&#10;&#10;（把文字贴在这里）">润色这段文字</button><button class="suggestion" data-prompt="请解释下面这段代码：先一句话概括它做什么，再逐块说明关键逻辑，最后指出可能的问题与改进点。&#10;&#10;（把代码贴在这里）">解释一段代码</button><button class="suggestion" data-prompt="请总结我附上的文档：先用三句话概括主旨，再分点列出要点与结论，最后标出需要我特别留意的地方。">总结这份文档</button><button class="suggestion" data-prompt="请把下面的中文译成自然、地道的英文，保持原有的语气与语域。若有多种译法，给出最合适的一种并简要说明取舍。&#10;&#10;（把文字贴在这里）">译成地道英文</button></div></div></section>
      <section id="chat" class="chat hidden"><div id="chatScroll" class="chat-scroll"><div class="chat-inner"><div class="chat-title"><h1 id="chatTitle" contenteditable="true" spellcheck="false" title="点击修改标题"></h1><div id="chatMeta"></div></div><div id="messages"></div></div></div></section>
      <section id="library" class="library-page hidden"><div class="library-inner"><div class="eyebrow"><span class="seal">卷</span><span>ARCHIVE</span></div><h1>卷宗</h1><p class="library-lead">常用的文件收在这里，随时置于案上。原件只存于此浏览器。<span id="libraryCountText" class="library-count"></span></p><div class="library-tools"><input id="librarySearch" class="field" placeholder="按文件名查找" aria-label="查找卷宗"><div class="segmented"><button data-library-kind="all" class="active">全部</button><button data-library-kind="image">画</button><button data-library-kind="text">文</button><button data-library-kind="file">卷</button></div><button id="libraryAdd" class="outline-btn">＋ 收入文件</button></div><div id="libraryGrid" class="library-grid"></div></div></section>
      <button id="jumpBottom" class="jump-bottom hidden" type="button">↓ 回到最新</button>
      <button id="quoteTip" class="quote-tip hidden" type="button">引用</button><div id="composerArea" class="composer-area hidden"><div class="composer"><div id="composerQuote" class="composer-quote hidden"><span class="composer-quote-text"></span><button id="composerQuoteClose" class="composer-quote-close" type="button" title="去掉引文" aria-label="去掉引文">✕</button></div><div id="attachments" class="attachment-list hidden"></div><textarea id="chatInput" rows="1" placeholder="接着说"></textarea><div class="composer-row"><div class="composer-left"><button class="text-btn attach-trigger"><span>＋</span>附件</button><button id="clearContext" class="text-btn" title="之前的记录仍在，只是不再随后面的问题送出">另起一纸</button><span id="contextCost" class="context-cost hidden" aria-live="off"></span></div><button id="chatSend" class="send-btn send-trigger" title="发送">↑</button></div></div><div class="hint">Enter 发送 · Shift + Enter 换行 · 粘贴即附图</div></div>
      <input id="fileInput" type="file" multiple class="hidden">
      <input id="libraryFileInput" type="file" multiple class="hidden">
      <input id="importInput" type="file" accept="application/json,.json" class="hidden">
    </main>
  </div>
  <div id="settingsModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="设置"><div class="modal-panel"><button id="closeSettings" class="icon-btn close-modal" title="关闭">×</button><nav class="settings-nav"><div class="settings-nav-title">设置</div><button class="tab-btn active" data-tab="general">通用</button><button class="tab-btn" data-tab="appearance">个性化</button><button class="tab-btn" data-tab="models">模型</button><div style="flex:1"></div><div style="padding:0 10px;color:var(--ink-3);font:11px/1.7 var(--title)">言下有知<br>字字留痕<br><span id="appVersion" style="opacity:.7"></span></div></nav><div id="settingsContent" class="settings-content"></div></div></div>
  <div id="dropVeil" class="drop-veil hidden"><div class="drop-sheet"><span class="drop-seal">添</span><span class="drop-copy"><strong id="dropTitle">松手，置于案上</strong><small id="dropHint">图片、文档与代码文件 · 单次共 8 MB</small></span></div></div>
  <div id="confirmModal" class="modal hidden" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle"><div class="confirm-panel"><span class="seal">问</span><h3 id="confirmTitle"></h3><p id="confirmBody"></p><div class="confirm-actions"><button id="confirmCancel" class="outline-btn">取消</button><button id="confirmOk" class="danger-btn solid">确定</button></div></div></div>
  <div id="imageViewer" class="image-viewer hidden" role="dialog" aria-modal="true" aria-labelledby="imageViewerName"><div class="image-viewer-head"><span class="seal" aria-hidden="true">画</span><span id="imageViewerName" class="image-viewer-name"></span><div class="image-viewer-actions"><button id="imageViewerZoom" type="button">原图</button><button id="imageViewerDownload" type="button">下载</button><button id="imageViewerClose" class="image-viewer-close" type="button" title="关闭" aria-label="关闭图片">×</button></div></div><div id="imageViewerStage" class="image-viewer-stage"><img id="imageViewerImage" class="image-viewer-image" alt=""></div></div>
  <div id="toast" class="toast hidden"></div>
  <script src="./vendor/marked.umd.js"></script>
  <script src="./vendor/purify.min.js"></script>
  <script src="./vendor/highlight.min.js"></script>
  <script src="./support.js"></script>
</body>
</html>
