      <header class="topbar">
        <div style="display:flex;align-items:center;gap:6px"><button id="mobileMenu" class="icon-btn mobile-menu hidden" title="打开侧栏">☰</button><div class="model-wrap"><button id="modelTrigger" class="model-trigger"><span class="model-dot"></span><span id="activeModelName">尚未配置模型</span><span style="font-size:9px;color:var(--ink-3)">▾</span></button><div id="modelMenu" class="model-menu hidden"></div></div></div>
        <div class="top-actions"><div id="connection" class="connection" data-state="idle"><span class="status-dot"></span><span id="connectionText">就绪</span></div><button id="themeToggle" class="icon-btn" title="切换明暗">☀</button><button id="quotaStatus" class="quota" title="打开模型余墨设置" aria-label="模型余墨量"><span class="quota-label">余墨</span><span class="ink-gauge" aria-hidden="true"><span class="quota-track"><span id="quotaFill" class="quota-fill"></span></span><svg class="ink-drop" viewBox="0 0 8 12"><path d="M4 .5C3.45 2.65.7 5.75.7 8.35A3.3 3.3 0 0 0 4 11.65a3.3 3.3 0 0 0 3.3-3.3C7.3 5.75 4.55 2.65 4 .5Z"/></svg></span><span id="quotaText" class="quota-text">未设</span></button></div>
      </header>
      <section id="welcome" class="welcome"><div class="welcome-inner"><div class="eyebrow"><span class="seal">言</span><span id="welcomeModel">LOCAL CHAT</span></div><h1 id="greeting">落笔，便有回声。</h1><p>一方清简纸面，容得下长问，也留得住慢答。</p><div class="composer"><div id="welcomeAttachments" class="attachment-list hidden"></div><textarea id="welcomeInput" rows="1" placeholder="写下第一句"></textarea><div class="composer-row"><button class="text-btn attach-trigger"><span>＋</span>附件</button><button class="send-btn send-trigger" title="发送">↑</button></div></div><div class="suggestions"><button class="suggestion">帮我理清一个复杂问题</button><button class="suggestion">把这段文字改得更克制</button><button class="suggestion">陪我从头理解一个概念</button></div></div></section>
      <section id="chat" class="chat hidden"><div id="chatScroll" class="chat-scroll"><div class="chat-inner"><div class="chat-title"><h1 id="chatTitle" contenteditable="true" spellcheck="false" title="点击修改标题"></h1><div id="chatMeta"></div></div><div id="messages"></div></div></div></section>
      <section id="library" class="library-page hidden"><div class="library-inner"><div class="eyebrow"><span class="seal">卷</span><span>ARCHIVE</span></div><h1>卷宗</h1><p class="library-lead">收存常用文件，随时置于案上，与消息一同送出。原件只存于此浏览器。<span id="libraryCountText" class="library-count"></span></p><div class="library-tools"><input id="librarySearch" class="field" placeholder="按文件名查找" aria-label="查找卷宗"><div class="segmented"><button data-library-kind="all" class="active">全部</button><button data-library-kind="image">画</button><button data-library-kind="text">文</button><button data-library-kind="file">卷</button></div><button id="libraryAdd" class="outline-btn">＋ 收入文件</button></div><div id="libraryGrid" class="library-grid"></div></div></section>
      <div id="composerArea" class="composer-area hidden"><div class="composer"><div id="attachments" class="attachment-list hidden"></div><textarea id="chatInput" rows="1" placeholder="继续输入"></textarea><div class="composer-row"><div class="composer-left"><button class="text-btn attach-trigger"><span>＋</span>附件</button><button id="clearContext" class="text-btn" title="在此插一道分隔：之前的记录仍可回看，但后续请求不再发给模型，省墨且不受旧话题干扰">另起上下文</button></div><button id="chatSend" class="send-btn send-trigger" title="发送">↑</button></div></div><div class="hint">Enter 发送 · Shift + Enter 换行 · 可直接粘贴图片</div></div>
      <input id="fileInput" type="file" multiple class="hidden">
      <input id="libraryFileInput" type="file" multiple class="hidden">
      <input id="importInput" type="file" accept="application/json,.json" class="hidden">
    </main>
  </div>
  <div id="settingsModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="设置"><div class="modal-panel"><button id="closeSettings" class="icon-btn close-modal" title="关闭">×</button><nav class="settings-nav"><div class="settings-nav-title">设置</div><button class="tab-btn active" data-tab="general">通用</button><button class="tab-btn" data-tab="appearance">外观</button><button class="tab-btn" data-tab="models">模型</button><div style="flex:1"></div><div style="padding:0 10px;color:var(--ink-3);font:11px/1.7 var(--title)">言下有知<br>字字留痕</div></nav><div id="settingsContent" class="settings-content"></div></div></div>
  <div id="dropVeil" class="drop-veil hidden"><div class="drop-sheet"><span class="drop-seal">添</span><span class="drop-copy"><strong id="dropTitle">松手，置于案上</strong><small id="dropHint">图片、文档与代码文件 · 单次共 8 MB</small></span></div></div>
  <div id="confirmModal" class="modal hidden" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle"><div class="confirm-panel"><span class="seal">问</span><h3 id="confirmTitle"></h3><p id="confirmBody"></p><div class="confirm-actions"><button id="confirmCancel" class="outline-btn">取消</button><button id="confirmOk" class="danger-btn solid">确定</button></div></div></div>
  <div id="toast" class="toast hidden"></div>
  <script src="./vendor/pdf.min.js"></script>
  <script src="./vendor/marked.umd.js"></script>
  <script src="./vendor/purify.min.js"></script>
  <script src="./vendor/highlight.min.js"></script>
  <script src="./vendor/katex/katex.min.js"></script>
  <script src="./vendor/mermaid.min.js"></script>
  <script src="./vendor/echarts.min.js"></script>
  <script src="./support.js"></script>
</body>
</html>
